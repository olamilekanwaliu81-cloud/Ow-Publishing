<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · OW Publishing Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=69">
  <link rel="stylesheet" href="css/admin.css?v=2">
</head>
<body class="admin">
  <div class="login-screen">
    <form class="login-card" id="loginForm" autocomplete="off">
      <img class="login-logo" src="assets/ow-logo-monogram.png" alt="OW Publishing House">
      <h1>OW Admin</h1>
      <p class="sub">Sign in to manage your website content.</p>

      <div class="fld">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="fld">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <label class="show-pw"><input type="checkbox" id="showPw"> Show password</label>
      </div>

      <button type="submit" class="btn btn-gold btn-lg" id="loginBtn">Sign in</button>
      <div class="msg err" id="loginErr"></div>

      <div class="login-sep"><span></span>no password?<span></span></div>
      <button type="button" class="btn btn-ghost" id="magicBtn" style="width:100%;justify-content:center">Email me a sign-in link</button>
      <div class="msg info" id="magicMsg"></div>
    </form>
  </div>

  <script src="js/supabase.js?v=1"></script>
  <script src="js/cms-config.js?v=1"></script>
  <script src="js/admin-login.js?v=1"></script>
</body>
</html>
